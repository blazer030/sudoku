<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 260" preserveAspectRatio="none">
    <!-- Home's misty mountains, from the canvas (Ink.dc .mountains): three ranges, the far one faintest, softened
         once by a blur when the image is rasterised (a static mask image, never a live filter in the DOM).
         Only alpha: currentColor shapes at three opacities. -->
    <defs>
        <filter id="mistblur" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    </defs>
    <g fill="currentColor">
