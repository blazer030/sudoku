        <path d="M-10 260 L-10 171 L28 195 L47 195 L86 195 L109 195 L144 177 L178 161 L197 151 L223 145 L256 162 L297 187 L339 195 L365 177 L398 178 L400 155 L400 260Z" opacity="0.12" filter="url(#mistblur)"/>
        <path d="M-10 260 L-10 216 L30 221 L65 198 L92 219 L126 235 L149 232 L186 228 L223 230 L244 207 L285 186 L308 180 L343 198 L372 197 L400 184 L400 260Z" opacity="0.16" filter="url(#mistblur)"/>
