<!-- Blueprint: Home's logo, a small engineering drawing used as a mask (alpha only); the skin paints it in the ink. After the style-research canvas's .drawing (Blueprint.dc.html, 170×104), in its coordinates: a 3×3 grid, a dimension line with arrowheads above it and one at its right, a small circle at its centre with a leader, and a registration cross at its left. The canvas's words (3 欄, 3 列, 宮) are left out, as a mask cannot follow the language; strokes are a little heavier, as the logo is drawn at 80px. -->
