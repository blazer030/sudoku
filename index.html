<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link href="/sudoku-green.svg" rel="icon" type="image/svg+xml" />
    <link href="/apple-touch-icon-green.png" rel="apple-touch-icon" />
    <link href="/manifest-green.webmanifest" rel="manifest" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <!-- The inline script below fills in the colour for the stored theme and mode -->
    <meta name="theme-color" />
    <script>
        // Applies the theme before first paint. Mirrors loadSettings(), effectiveColorMode() and
        // systemBarColor(); unknown values fall back the same way.
        (function () {
            // BEGIN theme-color data: systemBarColor() per style and theme. noFlashScript.test.ts keeps it in sync.
            var barColors = {
                minimal: {
                    dark: { green: "#111110", blue: "#111110", purple: "#111110", orange: "#111110", pink: "#111110", teal: "#111110" },
                    light: { green: "#176037", blue: "#2C5689", purple: "#614887", orange: "#7D4800", pink: "#863C55", teal: "#0A5E5F" }
                },
                tactile: {
                    dark: { green: "#1A1C1F", blue: "#1A1C1F", rust: "#1A1C1F", slate: "#1A1C1F" },
                    light: { green: "#1F5C3A", blue: "#24508A", rust: "#782F16", slate: "#34506E" }
                },
                // A style lists only the modes it has: paper is light only, so it has no dark entry
                paper: {
                    light: { blueInk: "#2B4A7A", greenInk: "#235A3C", redInk: "#8E2533" }
                },
                pixel: {
                    dark: { classic: "#000000" },
                    light: { classic: "#0F380F" }
                },
                // Dark only: no light entry
                cyber: {
                    dark: { neon: "#07070D" }
                },
                // Light only: no dark entry
                ink: {
                    light: { vermilion: "#B3261E" }
                },
                chalkboard: {
                    dark: { classic: "#2E4B3C" },
                    light: { classic: "#B04A00" }
                },
                // The paper in 藍曬圖; the orange pen in 製圖紙, the same for every ink
                blueprint: {
                    dark: { blue: "#123F78", teal: "#0E4D5C", slate: "#2B3A4E", rust: "#5A3A22" },
                    light: { blue: "#B34A00", teal: "#B34A00", slate: "#B34A00", rust: "#B34A00" }
                },
                // The night sky in 夜空; the colour chosen with in 晨光
                aurora: {
                    dark: { purple: "#060914", teal: "#060914", pink: "#060914", orange: "#060914" },
                    light: { purple: "#5B3FE0", teal: "#0A6F61", pink: "#C2185B", orange: "#A84808" }
                }
            };
            // END theme-color data
            var has = function (object, key) { return Object.prototype.hasOwnProperty.call(object, key); };
            var settings = {};
            try {
                settings = JSON.parse(localStorage.getItem("sudoku-settings") || "{}") || {};
            } catch (error) {
                settings = {};
            }
            var root = document.documentElement;
            var style = has(barColors, settings.style) ? settings.style : "minimal";
            var bar = barColors[style];
            // The theme list is the keys of whichever mode the style has (both list the same themes)
            var themeColors = bar.light || bar.dark;
            // A theme of another style falls back to the style's remembered theme, then its first
            // (key order follows THEME_IDS_BY_STYLE), as loadSettings() does
            var remembered = settings.colorThemeByStyle || {};
            var colorTheme = has(themeColors, settings.colorTheme) ? settings.colorTheme
                : has(themeColors, remembered[style]) ? remembered[style]
                    : Object.keys(themeColors)[0];
            root.setAttribute("data-style", style);
            root.setAttribute("data-color-theme", colorTheme);
            var systemDark = typeof window.matchMedia === "function"
                && window.matchMedia("(prefers-color-scheme: dark)").matches;
            // A stored "system" (or nothing) follows the system for this first paint; the app then
            // migrates it. A style with one mode is always in it.
            var dark = !has(bar, "light")
                || (has(bar, "dark") && (settings.appearance === "dark" || (settings.appearance !== "light" && systemDark)));
            if (dark) root.classList.add("dark");
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", (dark ? bar.dark : bar.light)[colorTheme]);
        })();
    </script>
    <!-- Fonts are bundled (src/style/fonts.css), so every style reads the same offline -->
    <title>Sudoku</title>
</head>
<body>
<div id="root"></div>
<script src="/src/main.ts" type="module"></script>
</body>
</html>
