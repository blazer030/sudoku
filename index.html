<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link href="/sudoku-green.svg" rel="icon" type="image/svg+xml" />
    <link href="/apple-touch-icon-green.png" rel="apple-touch-icon" />
    <link href="/manifest-green.webmanifest" rel="manifest" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <!-- The inline script below fills in the colour for the stored theme and mode -->
    <meta name="theme-color" />
    <script>
        // Applies the theme before first paint. Mirrors loadSettings(), resolveColorMode() and
        // systemBarColor(); unknown values fall back the same way.
        (function () {
            // BEGIN theme-color data: systemBarColor() per style and theme. noFlashScript.test.ts keeps it in sync.
            var barColors = {
                minimal: {
                    dark: "#111110",
                    light: { green: "#176037", blue: "#2C5689", purple: "#614887", orange: "#7D4800", pink: "#863C55", teal: "#0A5E5F" }
                },
                tactile: {
                    dark: "#1A1C1F",
                    light: { green: "#1F5C3A", blue: "#24508A", rust: "#782F16", slate: "#34506E" }
                },
                paper: {
                    dark: "#201D19",
                    light: { blueInk: "#2B4A7A", greenInk: "#235A3C", redInk: "#8E2533" }
                }
            };
            // END theme-color data
            var has = function (object, key) { return Object.prototype.hasOwnProperty.call(object, key); };
            var settings = {};
            try {
                settings = JSON.parse(localStorage.getItem("sudoku-settings") || "{}") || {};
            } catch (error) {
                settings = {};
            }
            var root = document.documentElement;
            var style = has(barColors, settings.style) ? settings.style : "minimal";
            var lightColors = barColors[style].light;
            // A theme of another style falls back to the style's remembered theme, then its first
            // (key order follows THEME_IDS_BY_STYLE), as loadSettings() does
            var remembered = settings.colorThemeByStyle || {};
            var colorTheme = has(lightColors, settings.colorTheme) ? settings.colorTheme
                : has(lightColors, remembered[style]) ? remembered[style]
                    : Object.keys(lightColors)[0];
            root.setAttribute("data-style", style);
            root.setAttribute("data-color-theme", colorTheme);
            var systemDark = typeof window.matchMedia === "function"
                && window.matchMedia("(prefers-color-scheme: dark)").matches;
            var dark = settings.appearance === "dark" || (settings.appearance !== "light" && systemDark);
            if (dark) root.classList.add("dark");
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", dark ? barColors[style].dark : lightColors[colorTheme]);
            // Only paper uses Caveat and LXGW WenKai TC; the same URLs as PAPER_FONT_URLS (paperFonts.ts),
            // which appearance sync adds and removes on a style switch. noFlashScript.test.ts keeps them in sync.
            if (style === "paper" && !document.querySelector("link[data-paper-font-link]")) {
                var paperFontUrls = [
                    "https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&text=0123456789&display=swap",
                    "https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap"
                ];
                for (var index = 0; index < paperFontUrls.length; index++) {
                    var link = document.createElement("link");
                    link.rel = "stylesheet";
                    link.href = paperFontUrls[index];
                    link.setAttribute("data-paper-font-link", "");
                    document.head.appendChild(link);
                }
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Paper's fonts load separately, only while paper is the style (see the inline script above).
         Offline (the Android app without network) every stack falls back to system fonts at the same sizes. -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Sudoku</title>
</head>
<body>
<div id="root"></div>
<script src="/src/main.ts" type="module"></script>
</body>
</html>
